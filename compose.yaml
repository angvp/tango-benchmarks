# The shared part of every run: PostgreSQL 17 with the same limits for every
# framework. Each app adds its own service in apps/<app>/compose.yaml.
name: tangobench
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench # a throwaway benchmark credential, never a secret
      POSTGRES_DB: bench
    ports:
      - "127.0.0.1:55440:5432"
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30
