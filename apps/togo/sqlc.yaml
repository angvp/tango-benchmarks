version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/schema"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/gen"
        emit_json_tags: true
        emit_db_tags: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "text"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: { type: "int64", pointer: true }
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type: { type: "int32", pointer: true }
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type: { type: "bool", pointer: true }
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type: { type: "float64", pointer: true }
          - db_type: "pg_catalog.numeric"
            go_type: "string"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "date"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "jsonb"
            go_type: "string"
          - db_type: "jsonb"
            nullable: true
            go_type: { type: "string", pointer: true }
