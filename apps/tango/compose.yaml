services:
  app:
    build: ./apps/tango
    environment:
      TANGO_DB_DSN: postgres://bench:bench@db:5432/bench?sslmode=disable
      TANGO_ADDR: ":8080"
      TANGO_ADMIN_PASSWORD: bench-staff-password
    ports:
      - "127.0.0.1:8080:8080"
    cpus: 2
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
